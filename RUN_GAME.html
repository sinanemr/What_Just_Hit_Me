<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Just Hit Me?</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/variables.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/menus.css">
<link rel="stylesheet" href="./css/character-select.css">
<link rel="stylesheet" href="./css/fight.css">
<link rel="stylesheet" href="./css/settings.css">
<link rel="stylesheet" href="./css/online.css">
</head>
<body>
<div id="app">

  <!-- TITLE -->
  <section id="title" class="screen active">
    <!-- logo/characters come from the background artwork (assets/ui/menu_bg.png) -->
    <h1>WHAT JUST<br><span>HIT ME?</span></h1>
    <div id="titleMenu" class="menuPanel">
      <div class="menuSkull">&#9760;</div>
      <button class="big" id="startBtn">LOCAL PLAY</button>
      <button class="big" id="onlinePlayBtn">MULTIPLAYER</button>
      <button class="big" id="titleSettingsBtn">SETTINGS</button>
      <button class="big" id="exitBtn">EXIT</button>
      <div class="menuBanner">&#9760;</div>
    </div>
    <div class="menuVersion">v1.0.0</div>
    <div class="menuTagline">WHOSE BODY<br>IS NEXT?</div>
    <!-- Control labels are generated from js/controls.js by main.js (no hardcoded keys). -->
    <div id="titleCtrlHelp" class="ctrlHelp"></div>
  </section>

  <!-- SELECT -->
  <section id="select" class="screen">
    <h2>CHOOSE YOUR FIGHTER</h2>
    <div class="hint">Click once for Player 1 (teal) · click again for Player 2 (crimson)</div>
    <div id="selPreview">
      <div class="prevSide">
        <canvas id="prev1" width="170" height="230"></canvas>
        <div class="prevName" id="prevName1">PLAYER 1</div>
      </div>
      <div id="vsSign">VS</div>
      <div class="prevSide">
        <canvas id="prev2" width="170" height="230"></canvas>
        <div class="prevName" id="prevName2">PLAYER 2</div>
      </div>
    </div>
    <div id="roster"></div>
    <div id="selInfo">
      <div class="bio" id="bio1"><b>PLAYER 1</b>Select a fighter…</div>
      <div class="bio" id="bio2"><b>PLAYER 2</b>Select a fighter…</div>
    </div>
    <div id="selBottom">
      <button id="selBackBtn">← MAIN MENU</button>
      <label class="opt">Opponent
        <select id="modeSel"><option value="cpu">CPU</option><option value="p2">Human (P2)</option></select>
      </label>
      <label class="opt">CPU level
        <select id="diffSel"><option value="0">Novice</option><option value="1" selected>Warrior</option><option value="2">Celestial</option><option value="3">Practice (test skills)</option></select>
      </label>
      <label class="opt">Stage
        <select id="stageSel">
          <option value="0">Kabatepe Port — Karatepe İskelesi</option>
        </select>
      </label>
      <button id="fightBtn" disabled>FIGHT!</button>
    </div>
  </section>

  <!-- FIGHT -->
  <section id="fight" class="screen">
    <canvas id="gameCanvas" width="720" height="270"></canvas>
    <div id="announce"></div>
    <div id="postFight">
      <h2 id="winTitle">VICTORY</h2>
      <p id="winLore"></p>
      <div class="row">
        <button id="rematchBtn">REMATCH</button>
        <button id="charBtn">CHARACTER SELECT</button>
      </div>
    </div>
    <div id="pauseMenu">
      <h2>PAUSED</h2>
      <div id="pauseMain" class="row">
        <button id="resumeBtn">RETURN TO GAME</button>
        <button id="settingsBtn">SETTINGS</button>
        <button id="menuBtn">MAIN MENU</button>
      </div>
    </div>
    <!-- Control labels are generated from js/controls.js by main.js (no hardcoded keys). -->
    <div id="fightCtrlHelp" class="ctrlHelp"></div>
  </section>
</div>
<!-- Plain scripts in order (config + controls define globals, then the engine, then labels).
     Classic scripts work over file:// AND http://, so index.html runs by double-click or via a server. -->
<script src="./js/config.js"></script>
<!-- generic map-override framework (stage-agnostic): MAP_DATA + mapDraw + world-limit application. -->
<script src="./js/map-system.js"></script>
<!-- KABATEPE STAGE: definition + editable-object registry, then its saved move/size + world-limit
     overrides. Both load BEFORE engine so world-limit overrides reach CFG in time. -->
<script src="./stages/kabatepe/kabatepe-stage.js"></script>
<script src="./stages/kabatepe/map-data.js"></script>
<script src="./js/controls.js"></script>
<script src="./js/settings.js"></script>
<script src="./js/engine.js"></script>
<!-- visual hitbox/alignment data model + runtime helpers (Character Lab) -->
<script src="./js/hitboxes.js"></script>
<!-- stage hazards: roaming dog + right-side toilet event (need engine globals) -->
<script src="./stages/kabatepe/dog.js"></script>
<script src="./stages/kabatepe/toilet.js"></script>
<!-- left-road parked traffic (decor only; needs engine globals) -->
<script src="./stages/kabatepe/cars.js"></script>
<!-- explodable, standable car in front of the boats (needs engine + cars.js globals) -->
<script src="./stages/kabatepe/car.js"></script>
<!-- explosive CO2 cylinders at player level (needs engine + cars.js globals) -->
<script src="./stages/kabatepe/co2explosive.js"></script>
<!-- left-road parked traffic (decor only; needs engine globals) -->
<script src="./stages/kabatepe/scaffold.js"></script>
<!-- metal ironboxes on/around the scaffolds (decor; needs engine + scaffold globals) -->
<script src="./stages/kabatepe/ironbox.js"></script>
<!-- compressor by the sea (decor only; needs engine globals) -->
<script src="./stages/kabatepe/compressorMech.js"></script>
<!-- compressor NPC in front of the boat (decor only; needs engine globals) -->
<script src="./stages/kabatepe/compressor.js"></script>
<!-- seated NPC by the sea (decor only; needs engine globals) -->
<script src="./stages/kabatepe/sitter.js"></script>
<!-- Wet suits (decor only; needs engine globals) -->
<script src="./stages/kabatepe/WetsuitsDry.js"></script>
<!-- yellow diving fins in front of the wetsuit rack (decor only; needs engine globals) -->
<script src="./stages/kabatepe/yellowfin.js"></script>
<!-- diving masks by the CO2 tank and the boat (decor only; needs engine globals) -->
<script src="./stages/kabatepe/scubaglasses.js"></script>
<!-- blue plastic crates by the regulator and the compressor (decor only; needs engine globals) -->
<script src="./stages/kabatepe/plasticcradle.js"></script>
<!-- fishbox (decor only; needs engine globals) -->
<script src="./stages/kabatepe/fishbox.js"></script>
<!-- lighthouse (decor only; needs engine globals) -->
<script src="./stages/kabatepe/lighthouse.js"></script>
<!-- CO2 Tank (decor only; needs engine globals) -->
<script src="./stages/kabatepe/CO2Tank.js"></script>
<!-- rod (decor only; needs engine globals) -->
<script src="./stages/kabatepe/fishingRod.js"></script>
<!-- Fishnet (decor only; needs engine globals) -->
<script src="./stages/kabatepe/fishnet.js"></script>
<!-- talking kids NPC (decor only; needs engine globals) -->
<script src="./stages/kabatepe/kids.js"></script>
<!-- talking tourists NPC (decor only; needs engine globals) -->
<script src="./stages/kabatepe/tourist.js"></script>
<!-- balikci NPC by the sea (decor only; needs engine globals) -->
<script src="./stages/kabatepe/balik.js"></script>
<!-- snacking kid on top of the boat (decor only; needs engine globals) -->
<script src="./stages/kabatepe/kid.js"></script>
<!-- diver checking his regulator, by the scuba tanks (decor only; needs engine globals) -->
<script src="./stages/kabatepe/regulator.js"></script>
<!-- coiled mooring ropes on the pier near the boats (decor only; needs engine globals) -->
<script src="./stages/kabatepe/rope.js"></script>
<!-- wooden pallets left around the otoparks (decor only; needs engine globals) -->
<script src="./stages/kabatepe/pallet.js"></script>
<!-- trashbins (decor only; needs engine globals) -->
<script src="./stages/kabatepe/trashbin.js"></script>
<!-- plastic chairs (decor only; needs engine globals) -->
<script src="./stages/kabatepe/seat.js"></script>
<!-- soda patio umbrellas (decor only; needs engine globals) -->
<script src="./stages/kabatepe/sodaumbrella.js"></script>
<!-- backgammon tables (decor only; needs engine globals) -->
<script src="./stages/kabatepe/blackgammon.js"></script>
<!-- wooden stools (decor only; needs engine globals) -->
<script src="./stages/kabatepe/stool.js"></script>
<!-- ambient seagulls in the sky (decor only; needs engine globals) -->
<script src="./stages/kabatepe/birds.js"></script>
<!-- shark fin in the distant sea (decor only; needs engine globals) -->
<script src="./stages/kabatepe/shark.js"></script>
<!-- subtle water shimmer on the sea (decor only; needs engine globals) -->
<script src="./stages/kabatepe/waves.js"></script>
<!-- Kabatepe editable-object registry: loads LAST (after every object file) so it can read each
     object's real anchor constant, then registers them with the Map system for the Map Editor. -->
<script src="./stages/kabatepe/kabatepe-objects.js"></script>
<!-- character modules (load AFTER engine.js; add one line per peeled character) -->
<script src="./characters/haydar.js"></script>
<script src="./characters/satori.js"></script>
<script src="./characters/no-talking-man.js"></script>
<script src="./characters/necaati.js"></script>
<script src="./characters/necmi.js"></script>
<script src="./characters/putuk.js"></script>
<script src="./characters/agron.js"></script>
<script src="./characters/munevver.js"></script>
<script src="./characters/warbringer.js"></script>
<!-- sprite manifest: rebuilds IMG_SPRITES from assets/characters/<char>/anim/<animation>/ subfolders
     (identical keys+metadata). Loads AFTER the character modules (overriding their inline sprites) and
     BEFORE the preloader in main.js. -->
<script src="./characters/sprite-manifest.js"></script>
<!-- authored hit/hurt/attack boxes + sprite alignment (written by tools/editor). Loads after all
     characters so IMG_SPRITES + HITBOXES exist; applies boxes and alignment onto the registry. -->
<script src="./characters/hitbox-data.js"></script>
<!-- settings UI (needs engine globals; must load before main.js which wires the buttons) -->
<script src="./js/settings-ui.js"></script>
<!-- online play: production network config FIRST (single source of truth), then
     state/serialization, WebSocket transport, and the online UI -->
<script src="./js/net-config.js"></script>
<script src="./js/online-state.js"></script>
<script src="./js/network-client.js"></script>
<script src="./js/online-ui.js"></script>
<!-- main.js runs LAST: calls bootGame() to build the roster from all loaded modules -->
<script src="./js/main.js"></script>
</body>
</html>
